<svg width="1600" height="420" viewBox="0 0 1600 420" xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#000000"/>
<stop offset="50%" stop-color="#111111"/>
<stop offset="100%" stop-color="#000000"/>
<animate attributeName="x1" values="0%;100%;0%" dur="12s" repeatCount="indefinite"/>
<animate attributeName="x2" values="100%;0%;100%" dur="12s" repeatCount="indefinite"/>
</linearGradient>

<linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#ffffff"/>
<stop offset="50%" stop-color="#cfcfcf"/>
<stop offset="100%" stop-color="#ffffff"/>
<animate attributeName="x1" values="-1;1;-1" dur="4s" repeatCount="indefinite"/>
<animate attributeName="x2" values="1;2;1" dur="4s" repeatCount="indefinite"/>
</linearGradient>

<filter id="glow">
<feGaussianBlur stdDeviation="6" result="blur"/>
<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

</defs>

<rect width="1600" height="420" fill="url(#bg)"/>

<g opacity="0.18">

<circle cx="150" cy="120" r="3" fill="white">
<animate attributeName="cy" values="120;90;120" dur="4s" repeatCount="indefinite"/>
</circle>

<circle cx="300" cy="300" r="2" fill="white">
<animate attributeName="cy" values="300;260;300" dur="5s" repeatCount="indefinite"/>
</circle>

<circle cx="650" cy="90" r="2" fill="white">
<animate attributeName="cy" values="90;50;90" dur="6s" repeatCount="indefinite"/>
</circle>

<circle cx="900" cy="330" r="2" fill="white">
<animate attributeName="cy" values="330;290;330" dur="5s" repeatCount="indefinite"/>
</circle>

<circle cx="1200" cy="100" r="3" fill="white">
<animate attributeName="cy" values="100;60;100" dur="4s" repeatCount="indefinite"/>
</circle>

<circle cx="1450" cy="260" r="2" fill="white">
<animate attributeName="cy" values="260;220;260" dur="5s" repeatCount="indefinite"/>
</circle>

</g>

<text
x="800"
y="180"
text-anchor="middle"
font-size="74"
font-family="JetBrains Mono, Consolas, monospace"
font-weight="800"
fill="url(#text)"
filter="url(#glow)"
>

DarkLight000999

<animate attributeName="opacity"
values="0.85;1;0.85"
dur="2s"
repeatCount="indefinite"/>

</text>

<text
x="800"
y="245"
text-anchor="middle"
font-size="24"
font-family="JetBrains Mono"
fill="#BDBDBD"
>

Cyber Security Professional • Ethical Hacker • Security Researcher

</text>

<line x1="420" y1="285" x2="1180" y2="285"
stroke="#FFFFFF"
stroke-width="1"
opacity="0.35">

<animate attributeName="opacity"
values="0.1;0.7;0.1"
dur="3s"
repeatCount="indefinite"/>

</line>

<text
x="800"
y="330"
text-anchor="middle"
font-size="18"
font-family="JetBrains Mono"
fill="#8E8E8E"
>

「 DEFEND • ANALYZE • INNOVATE 」

</text>

</svg>
