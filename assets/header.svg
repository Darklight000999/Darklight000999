<svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" viewBox="0 0 1600 520" width="1600" height="520">
<defs>
<style>
@keyframes scan {
0% { transform: translateY(-50px); opacity: 0; }
10% { opacity: 1; }
90% { opacity: 1; }
100% { transform: translateY(570px); opacity: 0; }
}
@keyframes pulse {
0% { opacity: 0.3; transform: scale(0.95); }
50% { opacity: 0.8; transform: scale(1.05); }
100% { opacity: 0.3; transform: scale(0.95); }
}
@keyframes float1 {
0% { transform: translateY(0px); }
50% { transform: translateY(-8px); }
100% { transform: translateY(0px); }
}
@keyframes float2 {
0% { transform: translateY(0px); }
50% { transform: translateY(-12px); }
100% { transform: translateY(0px); }
}
@keyframes float3 {
0% { transform: translateY(0px); }
50% { transform: translateY(-6px); }
100% { transform: translateY(0px); }
}
@keyframes particles {
0% { transform: translateY(0) translateX(0); opacity: 0; }
20% { opacity: 0.8; }
80% { opacity: 0.8; }
100% { transform: translateY(-200px) translateX(20px); opacity: 0; }
}
@keyframes statusPulse {
0% { opacity: 0.4; }
50% { opacity: 1; box-shadow: 0 0 10px #00ffcc; }
100% { opacity: 0.4; }
}
@keyframes titleGlow {
0% { filter: drop-shadow(0 0 15px rgba(0, 242, 254, 0.4)); }
50% { filter: drop-shadow(0 0 25px rgba(245, 87, 108, 0.6)); }
100% { filter: drop-shadow(0 0 15px rgba(0, 242, 254, 0.4)); }
}
.title-text {
font-family: system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, sans-serif;
font-size: 88px;
font-weight: 900;
letter-spacing: 6px;
text-anchor: middle;
fill: url(#metal);
animation: titleGlow 6s infinite alternate;
}
.subtitle-text {
font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
font-size: 22px;
font-weight: 500;
letter-spacing: 3px;
text-anchor: middle;
fill: #a0aec0;
}
.status-text {
font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
font-size: 13px;
font-weight: 600;
letter-spacing: 4px;
fill: #e2e8f0;
}
.skill-text {
font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
font-size: 16px;
font-weight: 600;
letter-spacing: 1px;
text-anchor: middle;
alignment-baseline: central;
fill: #ffffff;
}
.quote-text {
font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
font-size: 18px;
font-weight: 700;
letter-spacing: 8px;
text-anchor: middle;
fill: #4a5568;
}
.glass-panel {
fill: rgba(20, 20, 25, 0.6);
stroke: url(#rgbBorder);
stroke-width: 1.5;
}
</style>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
<circle cx="40" cy="40" r="1" fill="rgba(255,255,255,0.1)"/>
</pattern>
<linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#ffffff" />
<stop offset="35%" stop-color="#f0f0f0" />
<stop offset="50%" stop-color="#a0a0a0" />
<stop offset="65%" stop-color="#d0d0d0" />
<stop offset="100%" stop-color="#606060" />
</linearGradient>
<linearGradient id="shine" x1="-100%" y1="0%" x2="0%" y2="0%">
<animate attributeName="x1" values="-100%; 200%" dur="4s" repeatCount="indefinite"/>
<animate attributeName="x2" values="0%; 300%" dur="4s" repeatCount="indefinite"/>
<stop offset="0%" stop-color="transparent" />
<stop offset="50%" stop-color="rgba(255,255,255,0.8)" />
<stop offset="100%" stop-color="transparent" />
</linearGradient>
<linearGradient id="rgbBorder" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#00f2fe">
<animate attributeName="stop-color" values="#00f2fe;#4facfe;#f093fb;#f5576c;#00f2fe" dur="6s" repeatCount="indefinite" />
</stop>
<stop offset="50%" stop-color="#f093fb">
<animate attributeName="stop-color" values="#f093fb;#f5576c;#00f2fe;#4facfe;#f093fb" dur="6s" repeatCount="indefinite" />
</stop>
<stop offset="100%" stop-color="#f5576c">
<animate attributeName="stop-color" values="#f5576c;#00f2fe;#4facfe;#f093fb;#f5576c" dur="6s" repeatCount="indefinite" />
</stop>
</linearGradient>
<linearGradient id="laserGrad" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="rgba(0, 242, 254, 0.4)"/>
<stop offset="100%" stop-color="rgba(0, 242, 254, 0)"/>
</linearGradient>
<filter id="glow">
<feGaussianBlur stdDeviation="8" result="blur" />
<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>
<filter id="ambientBlur">
<feGaussianBlur stdDeviation="90" />
</filter>
<filter id="pillShadow">
<feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
</filter>
</defs>
<rect width="100%" height="100%" fill="#050507" />
<circle cx="200" cy="100" r="250" fill="rgba(0, 242, 254, 0.12)" filter="url(#ambientBlur)" style="animation: pulse 8s infinite alternate;" />
<circle cx="1400" cy="400" r="250" fill="rgba(245, 87, 108, 0.12)" filter="url(#ambientBlur)" style="animation: pulse 10s infinite alternate-reverse;" />
<circle cx="800" cy="250" r="300" fill="rgba(161, 140, 209, 0.08)" filter="url(#ambientBlur)" style="animation: pulse 12s infinite alternate;" />
<rect width="100%" height="100%" fill="url(#grid)" />
<g style="animation: particles 12s linear infinite; animation-delay: 0s;">
<circle cx="150" cy="500" r="2" fill="#00f2fe" filter="url(#glow)"/>
</g>
<g style="animation: particles 15s linear infinite; animation-delay: -3s;">
<circle cx="450" cy="480" r="3" fill="#f5576c" filter="url(#glow)"/>
</g>
<g style="animation: particles 10s linear infinite; animation-delay: -7s;">
<circle cx="850" cy="520" r="2.5" fill="#f093fb" filter="url(#glow)"/>
</g>
<g style="animation: particles 14s linear infinite; animation-delay: -5s;">
<circle cx="1150" cy="490" r="1.5" fill="#00f2fe" filter="url(#glow)"/>
</g>
<g style="animation: particles 11s linear infinite; animation-delay: -9s;">
<circle cx="1450" cy="510" r="3" fill="#ffffff" filter="url(#glow)"/>
</g>
<g style="animation: scan 5s linear infinite;">
<rect x="0" y="0" width="1600" height="2" fill="#00f2fe" filter="url(#glow)"/>
<polygon points="0,0 1600,0 1600,80 0,80" fill="url(#laserGrad)"/>
</g>
<g transform="translate(480, 45)">
<rect x="0" y="0" width="640" height="36" rx="18" fill="rgba(20, 20, 25, 0.5)" stroke="rgba(255,255,255,0.1)" stroke-width="1" filter="url(#pillShadow)"/>
<circle cx="35" cy="18" r="5" fill="#00ffcc" filter="url(#glow)" style="animation: statusPulse 2s infinite;"/>
<text x="60" y="23" class="status-text">ONLINE • ACTIVE • BUILDING • ALWAYS LEARNING • SECURING</text>
</g>
<g transform="translate(800, 185)">
<text x="0" y="0" class="title-text">DarkLight000999</text>
<text x="0" y="0" class="title-text" fill="url(#shine)" style="animation: none; filter: none;">DarkLight000999</text>
</g>
<text x="800" y="245" class="subtitle-text">Cyber Security Professional • Ethical Hacker • Security Researcher</text>
<g transform="translate(0, 310)">
<g style="animation: float1 5s ease-in-out infinite;">
<rect x="305" y="0" width="170" height="44" rx="22" class="glass-panel" filter="url(#pillShadow)"/>
<text x="390" y="22" class="skill-text">Cyber Security</text>
</g>
<g style="animation: float2 5.5s ease-in-out infinite; animation-delay: -1s;">
<rect x="495" y="0" width="170" height="44" rx="22" class="glass-panel" filter="url(#pillShadow)"/>
<text x="580" y="22" class="skill-text">Ethical Hacking</text>
</g>
<g style="animation: float3 6s ease-in-out infinite; animation-delay: -2s;">
<rect x="685" y="0" width="210" height="44" rx="22" class="glass-panel" filter="url(#pillShadow)"/>
<text x="790" y="22" class="skill-text">Penetration Testing</text>
</g>
<g style="animation: float1 5.2s ease-in-out infinite; animation-delay: -0.5s;">
<rect x="915" y="0" width="260" height="44" rx="22" class="glass-panel" filter="url(#pillShadow)"/>
<text x="1045" y="22" class="skill-text">Web Application Security</text>
</g>
<g style="animation: float2 4.8s ease-in-out infinite; animation-delay: -1.5s;">
<rect x="1195" y="0" width="100" height="44" rx="22" class="glass-panel" filter="url(#pillShadow)"/>
<text x="1245" y="22" class="skill-text">Linux</text>
</g>
</g>
<g transform="translate(0, 370)">
<g style="animation: float2 5.8s ease-in-out infinite; animation-delay: -0.8s;">
<rect x="420" y="0" width="110" height="44" rx="22" class="glass-panel" filter="url(#pillShadow)"/>
<text x="475" y="22" class="skill-text">Python</text>
</g>
<g style="animation: float3 5.4s ease-in-out infinite; animation-delay: -1.8s;">
<rect x="550" y="0" width="100" height="44" rx="22" class="glass-panel" filter="url(#pillShadow)"/>
<text x="600" y="22" class="skill-text">Bash</text>
</g>
<g style="animation: float1 5.6s ease-in-out infinite; animation-delay: -2.5s;">
<rect x="670" y="0" width="110" height="44" rx="22" class="glass-panel" filter="url(#pillShadow)"/>
<text x="725" y="22" class="skill-text">OSINT</text>
</g>
<g style="animation: float2 6.2s ease-in-out infinite; animation-delay: -0.3s;">
<rect x="800" y="0" width="190" height="44" rx="22" class="glass-panel" filter="url(#pillShadow)"/>
<text x="895" y="22" class="skill-text">Network Security</text>
</g>
<g style="animation: float3 5.1s ease-in-out infinite; animation-delay: -1.2s;">
<rect x="1010" y="0" width="170" height="44" rx="22" class="glass-panel" filter="url(#pillShadow)"/>
<text x="1095" y="22" class="skill-text">Cloud Security</text>
</g>
</g>
<g transform="translate(0, 430)">
<g style="animation: float3 5.5s ease-in-out infinite; animation-delay: -2.1s;">
<rect x="405" y="0" width="90" height="44" rx="22" class="glass-panel" filter="url(#pillShadow)"/>
<text x="450" y="22" class="skill-text">Git</text>
</g>
<g style="animation: float1 6.1s ease-in-out infinite; animation-delay: -0.7s;">
<rect x="515" y="0" width="110" height="44" rx="22" class="glass-panel" filter="url(#pillShadow)"/>
<text x="570" y="22" class="skill-text">GitHub</text>
</g>
<g style="animation: float2 5.3s ease-in-out infinite; animation-delay: -1.9s;">
<rect x="645" y="0" width="150" height="44" rx="22" class="glass-panel" filter="url(#pillShadow)"/>
<text x="720" y="22" class="skill-text">Automation</text>
</g>
<g style="animation: float3 5.7s ease-in-out infinite; animation-delay: -0.4s;">
<rect x="815" y="0" width="200" height="44" rx="22" class="glass-panel" filter="url(#pillShadow)"/>
<text x="915" y="22" class="skill-text">Security Research</text>
</g>
<g style="animation: float1 5.9s ease-in-out infinite; animation-delay: -1.6s;">
<rect x="1035" y="0" width="160" height="44" rx="22" class="glass-panel" filter="url(#pillShadow)"/>
<text x="1115" y="22" class="skill-text">Open Source</text>
</g>
</g>
<text x="800" y="505" class="quote-text">DEFEND • ANALYZE • BUILD • INNOVATE</text>
</svg>
