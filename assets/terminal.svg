<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00FFCC" stroke-width="0.5" stroke-opacity="0.1"/>
    </pattern>

    <!-- Glowing Filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="ambient-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glass-blur">
      <feGaussianBlur stdDeviation="15" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.8" />
      </feComponentTransfer>
    </filter>

    <!-- Gradients -->
    <linearGradient id="rgb-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFCC">
        <animate attributeName="stop-color" values="#00FFCC;#FF2D95;#9D4DFF;#00FFCC" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#9D4DFF">
        <animate attributeName="stop-color" values="#9D4DFF;#00FFCC;#FF2D95;#9D4DFF" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#FF2D95">
        <animate attributeName="stop-color" values="#FF2D95;#9D4DFF;#00FFCC;#FF2D95" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Typing Clip Paths -->
    <clipPath id="clip-line1">
      <rect x="220" y="100" width="0" height="24">
        <animate attributeName="width" values="0;0;400;400" keyTimes="0;0.05;0.15;1" dur="14s" repeatCount="indefinite" />
      </rect>
    </clipPath>
    <clipPath id="clip-line2">
      <rect x="220" y="120" width="0" height="24">
        <animate attributeName="width" values="0;0;400;400" keyTimes="0;0.16;0.26;1" dur="14s" repeatCount="indefinite" />
      </rect>
    </clipPath>
    
    <!-- Progress Bar Width -->
    <clipPath id="clip-progress">
      <rect x="220" y="318" width="0" height="12">
        <animate attributeName="width" values="0;0;10;60;150;240;350;400;400" keyTimes="0;0.45;0.46;0.48;0.51;0.54;0.57;0.6;1" dur="14s" repeatCount="indefinite" />
      </rect>
    </clipPath>

    <style>
      /* Base Typography */
      text {
        font-family: 'Menlo', 'Monaco', 'Consolas', 'Courier New', monospace;
        font-size: 14px;
        letter-spacing: 0.5px;
      }
      
      .title {
        font-weight: bold;
        font-size: 14px;
        fill: #FFFFFF;
      }

      /* Colors */
      .c-cyan { fill: #00FFCC; }
      .c-blue { fill: #00E5FF; }
      .c-pink { fill: #FF2D95; }
      .c-purple { fill: #9D4DFF; }
      .c-green { fill: #00FF66; }
      .c-white { fill: #FFFFFF; }
      .c-gray { fill: #8892B0; }
      
      .bg-primary { fill: #050507; }
      
      /* Terminal Styling */
      .glass-bg {
        fill: #0c0d14;
        fill-opacity: 0.85;
      }

      /* Animations */
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor {
        animation: blink 1s step-end infinite;
      }

      @keyframes pulseGrid {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 0.3; }
      }
      .grid {
        animation: pulseGrid 4s ease-in-out infinite;
      }

      @keyframes scanlineMove {
        0% { transform: translateY(-500px); }
        100% { transform: translateY(500px); }
      }
      .scanline {
        animation: scanlineMove 6s linear infinite;
        fill: rgba(0, 255, 204, 0.05);
      }

      @keyframes floatUp {
        0% { transform: translateY(10px) translateX(0px); opacity: 0; }
        20% { opacity: 0.8; }
        80% { opacity: 0.8; }
        100% { transform: translateY(-500px) translateX(20px); opacity: 0; }
      }
      .particle {
        animation: floatUp 8s infinite linear;
      }
      .particle:nth-child(2) { animation-duration: 10s; animation-delay: 2s; }
      .particle:nth-child(3) { animation-duration: 12s; animation-delay: 1s; }
      .particle:nth-child(4) { animation-duration: 9s; animation-delay: 4s; }
      .particle:nth-child(5) { animation-duration: 11s; animation-delay: 0.5s; }

      @keyframes binaryRain {
        0% { transform: translateY(-100px); opacity: 0; }
        10% { opacity: 0.5; }
        90% { opacity: 0.5; }
        100% { transform: translateY(600px); opacity: 0; }
      }
      .binary {
        font-family: monospace;
        font-size: 12px;
        fill: #00FFCC;
        opacity: 0;
        animation: binaryRain linear infinite;
      }
      .b1 { animation-duration: 5s; animation-delay: 0s; }
      .b2 { animation-duration: 7s; animation-delay: 1s; }
      .b3 { animation-duration: 6s; animation-delay: 2s; }
      .b4 { animation-duration: 8s; animation-delay: 3s; }
      
      .step { opacity: 0; animation: appear 14s infinite; }
      @keyframes appear {
        0%, 100% { opacity: 0; }
      }

      .m1 { animation: stepHold 14s infinite; animation-delay: 3.9s; }
      .m2 { animation: stepHold 14s infinite; animation-delay: 4.1s; }
      .m3 { animation: stepHold 14s infinite; animation-delay: 4.3s; }
      .m4 { animation: stepHold 14s infinite; animation-delay: 4.5s; }
      .m5 { animation: stepHold 14s infinite; animation-delay: 4.7s; }
      .m6 { animation: stepHold 14s infinite; animation-delay: 4.9s; }
      .m7 { animation: stepHold 14s infinite; animation-delay: 5.1s; }
      .m8 { animation: stepHold 14s infinite; animation-delay: 5.3s; }
      .m9 { animation: stepHold 14s infinite; animation-delay: 5.5s; }
      .p-text { animation: stepHold 14s infinite; animation-delay: 6.0s; }
      .p-bar { animation: stepHold 14s infinite; animation-delay: 6.3s; }
      
      .s-online { animation: stepHold 14s infinite; animation-delay: 8.5s; }
      .s-access { animation: stepHold 14s infinite; animation-delay: 9.0s; }
      .s-welcome { animation: stepHold 14s infinite; animation-delay: 9.5s; }
      .s-user { animation: stepHold 14s infinite; animation-delay: 10.0s; }
      .s-prompt { animation: stepHold 14s infinite; animation-delay: 11.0s; }

      @keyframes stepHold {
        0% { opacity: 0; }
        1% { opacity: 1; }
        100% { opacity: 1; }
      }

      /* Progress Numbers Overlay Animation */
      .pn { opacity: 0; animation: progNum 14s infinite; }
      @keyframes progNum {
        0%, 100% { opacity: 0; }
        1% { opacity: 1; }
        99% { opacity: 1; }
      }
      
      .pn-0 { animation-delay: 6.30s; animation-duration: 0.14s; }
      .pn-15 { animation-delay: 6.44s; animation-duration: 0.28s; }
      .pn-35 { animation-delay: 6.72s; animation-duration: 0.42s; }
      .pn-52 { animation-delay: 7.14s; animation-duration: 0.42s; }
      .pn-76 { animation-delay: 7.56s; animation-duration: 0.42s; }
      .pn-91 { animation-delay: 7.98s; animation-duration: 0.42s; }
      .pn-100 { animation-delay: 8.40s; animation-duration: 5.60s; } 

      @keyframes breathe {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(0,255,204,0.2)); }
        50% { transform: scale(1.002); filter: drop-shadow(0 0 25px rgba(0,255,204,0.4)); }
      }
      .terminal-window {
        transform-origin: center;
        animation: breathe 6s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1600" height="500" class="bg-primary" />
  
  <!-- Ambient Glows -->
  <circle cx="200" cy="100" r="250" fill="#00FFCC" opacity="0.15" filter="url(#ambient-glow)" />
  <circle cx="1400" cy="400" r="300" fill="#9D4DFF" opacity="0.15" filter="url(#ambient-glow)" />
  <circle cx="800" cy="250" r="400" fill="#FF2D95" opacity="0.08" filter="url(#ambient-glow)" />

  <!-- Animated Grid -->
  <rect width="1600" height="500" fill="url(#grid)" class="grid" />

  <!-- Floating Particles & Binary Rain -->
  <g>
    <!-- Binary Rain -->
    <text x="50" y="0" class="binary b1">0 1 0 0 1</text>
    <text x="150" y="0" class="binary b2">1 0 1 1 0</text>
    <text x="1450" y="0" class="binary b3">0 0 1 0 1</text>
    <text x="1550" y="0" class="binary b4">1 1 0 0 0</text>
    <text x="1350" y="0" class="binary b1" style="animation-delay: 1.5s;">0 1 1 0 1</text>
    
    <!-- Particles -->
    <circle cx="100" cy="450" r="2" fill="#00FFCC" class="particle" filter="url(#neon-glow)" />
    <circle cx="300" cy="480" r="3" fill="#FF2D95" class="particle" filter="url(#neon-glow)" />
    <circle cx="1200" cy="420" r="1.5" fill="#9D4DFF" class="particle" filter="url(#neon-glow)" />
    <circle cx="1400" cy="460" r="2.5" fill="#00FFCC" class="particle" filter="url(#neon-glow)" />
    <circle cx="1500" cy="490" r="2" fill="#FF2D95" class="particle" filter="url(#neon-glow)" />
  </g>

  <!-- Moving Scan Line -->
  <rect width="1600" height="100" class="scanline" />

  <!-- TERMINAL WINDOW -->
  <g class="terminal-window">
    
    <!-- Glass Backdrop Drop Shadow -->
    <rect x="230" y="45" width="1140" height="410" rx="12" fill="#000000" opacity="0.6" filter="url(#ambient-glow)" />

    <!-- Animated RGB Border -->
    <rect x="228" y="43" width="1144" height="414" rx="12" fill="none" stroke="url(#rgb-border)" stroke-width="3" filter="url(#neon-glow)" />
    
    <!-- Window Body (Glassmorphism) -->
    <rect x="230" y="45" width="1140" height="410" rx="10" class="glass-bg" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.1" />

    <!-- Top Title Bar -->
    <path d="M 230 55 A 10 10 0 0 1 240 45 L 1360 45 A 10 10 0 0 1 1370 55 L 1370 85 L 230 85 Z" fill="#151720" fill-opacity="0.95" />
    <line x1="230" y1="85" x2="1370" y2="85" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1" />

    <!-- Mac Buttons -->
    <circle cx="255" cy="65" r="6" fill="#FF5F56" />
    <circle cx="275" cy="65" r="6" fill="#FFBD2E" />
    <circle cx="295" cy="65" r="6" fill="#27C93F" />

    <!-- Title Bar Text -->
    <text x="800" y="70" class="title" text-anchor="middle">root@DarkLight000999: ~</text>

    <!-- TERMINAL CONTENT -->
    <g transform="translate(10, 15)">
      
      <!-- Line 1: Typing -->
      <g clip-path="url(#clip-line1)">
        <text x="240" y="105">
          <tspan class="c-blue">┌──(</tspan><tspan class="c-pink">root㉿DarkLight000999</tspan><tspan class="c-blue">)-[</tspan><tspan class="c-white">~</tspan><tspan class="c-blue">]</tspan>
        </text>
      </g>
      
      <!-- Line 2: Typing -->
      <g clip-path="url(#clip-line2)">
        <text x="240" y="125">
          <tspan class="c-blue">└─$ </tspan><tspan class="c-white">./system_init.sh --verbose</tspan>
        </text>
      </g>

      <!-- Modules Loading -->
      <g style="font-size: 13px;">
        <text x="240" y="155" class="m1"><tspan class="c-green">[+]</tspan> <tspan class="c-gray">Loading Cyber Security Modules........ </tspan><tspan class="c-green">[ OK ]</tspan></text>
        <text x="240" y="173" class="m2"><tspan class="c-green">[+]</tspan> <tspan class="c-gray">Booting Ethical Hacking Toolkit....... </tspan><tspan class="c-green">[ OK ]</tspan></text>
        <text x="240" y="191" class="m3"><tspan class="c-green">[+]</tspan> <tspan class="c-gray">Initializing Linux Environment........ </tspan><tspan class="c-green">[ OK ]</tspan></text>
        <text x="240" y="209" class="m4"><tspan class="c-green">[+]</tspan> <tspan class="c-gray">Starting Python Automation............ </tspan><tspan class="c-green">[ OK ]</tspan></text>
        <text x="240" y="227" class="m5"><tspan class="c-green">[+]</tspan> <tspan class="c-gray">Syncing OSINT Database................ </tspan><tspan class="c-green">[ OK ]</tspan></text>
        <text x="240" y="245" class="m6"><tspan class="c-green">[+]</tspan> <tspan class="c-gray">Loading Penetration Testing Suite..... </tspan><tspan class="c-green">[ OK ]</tspan></text>
        <text x="240" y="263" class="m7"><tspan class="c-green">[+]</tspan> <tspan class="c-gray">Verifying Secure Network.............. </tspan><tspan class="c-green">[ OK ]</tspan></text>
        <text x="240" y="281" class="m8"><tspan class="c-green">[+]</tspan> <tspan class="c-gray">Hardening Web Applications............ </tspan><tspan class="c-green">[ OK ]</tspan></text>
        <text x="240" y="299" class="m9"><tspan class="c-green">[+]</tspan> <tspan class="c-gray">Security Research Modules............. </tspan><tspan class="c-green">[ OK ]</tspan></text>
      </g>

      <!-- Progress Section -->
      <text x="240" y="325" class="p-text c-white">Progress: </text>
      
      <!-- Progress Bar Graphic -->
      <g class="p-bar" transform="translate(325, 316)">
        <!-- Track -->
        <rect x="0" y="0" width="400" height="10" fill="#151720" rx="3" stroke="#FFFFFF" stroke-opacity="0.1" />
        <!-- Fill (Animated) -->
        <g clip-path="url(#clip-progress)" transform="translate(-220, -318)">
          <rect x="220" y="318" width="400" height="10" fill="url(#rgb-border)" rx="3" filter="url(#neon-glow)" />
          <rect x="220" y="318" width="400" height="10" fill="#00FFCC" rx="3" />
        </g>
      </g>

      <!-- Progress Numbers -->
      <g font-weight="bold" font-size="13px" class="c-cyan" transform="translate(740, 325)">
        <text class="pn pn-0">0%</text>
        <text class="pn pn-15">15%</text>
        <text class="pn pn-35">35%</text>
        <text class="pn pn-52">52%</text>
        <text class="pn pn-76">76%</text>
        <text class="pn pn-91">91%</text>
        <text class="pn pn-100">100%</text>
      </g>

      <!-- Final Output Status -->
      <text x="240" y="355" class="s-online c-green" font-weight="bold">SYSTEM ONLINE</text>
      <text x="240" y="375" class="s-access c-cyan" font-weight="bold">ACCESS GRANTED</text>
      <text x="240" y="395" class="s-welcome c-white" font-weight="bold">WELCOME BACK</text>
      <text x="240" y="415" class="s-user c-pink" font-weight="bold" filter="url(#neon-glow)">DarkLight000999</text>

      <!-- Final Prompt & Blinking Cursor -->
      <g class="s-prompt">
        <text x="240" y="445">
          <tspan class="c-blue">root@DarkLight000999:~$ </tspan>
          <tspan class="c-cyan cursor" font-weight="bold">_</tspan>
        </text>
      </g>
      
    </g>
  </g>
</svg>
